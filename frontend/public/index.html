<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#F6F1E9" />
        <meta name="description" content="Anahom Stays — a quiet hospitality company in Goa. A house knows when it is cared for. We look after a small number of homes as though they were our own." />
        <link rel="canonical" href="https://anahomstays.com/" />

        <!-- The mark, not the wordmark: a wordmark is illegible at 16px.
             The charcoal plate keeps the gold readable on light and dark
             browser chrome alike. -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/site.webmanifest" />

        <!-- This link gets shared on WhatsApp far more than anywhere else
             for this audience, so the unfurl has to carry the brand. -->
        <meta property="og:site_name" content="Anahom Stays" />
        <meta property="og:title" content="Anahom Stays — a quiet hospitality company in Goa" />
        <meta property="og:description" content="A house knows when it is cared for. We look after a small number of homes in Goa as though they were our own." />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://anahomstays.com/" />
        <meta property="og:locale" content="en_IN" />
        <meta property="og:image" content="https://anahomstays.com/og-image.jpg" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="A lime-washed Anahom living room with soft arches and morning light" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Anahom Stays — a quiet hospitality company in Goa" />
        <meta name="twitter:description" content="A house knows when it is cared for. We look after a small number of homes in Goa as though they were our own." />
        <meta name="twitter:image" content="https://anahomstays.com/og-image.jpg" />

        <link rel="preconnect" href="https://res.cloudinary.com" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <!-- The signature face, loaded here rather than via @import in the
             CSS: an @import serialises (HTML → CSS → font CSS → font), a
             link starts it in parallel with everything else. -->
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@500;600&display=swap"
            />
        </noscript>

        <!-- The opening shot starts downloading immediately, in parallel
             with the JavaScript, instead of waiting for React to mount and
             ask for it. imagesrcset mirrors the ladder in Frame.jsx so the
             browser preloads exactly the size it will actually use. -->
        <link
            rel="preload"
            as="image"
            fetchpriority="high"
            href="https://res.cloudinary.com/dlcijbrpw/image/upload/f_auto,q_auto,w_1600/20_oyfxs5"
            imagesrcset="
                https://res.cloudinary.com/dlcijbrpw/image/upload/f_auto,q_auto,w_640/20_oyfxs5 640w,
                https://res.cloudinary.com/dlcijbrpw/image/upload/f_auto,q_auto,w_960/20_oyfxs5 960w,
                https://res.cloudinary.com/dlcijbrpw/image/upload/f_auto,q_auto,w_1280/20_oyfxs5 1280w,
                https://res.cloudinary.com/dlcijbrpw/image/upload/f_auto,q_auto,w_1600/20_oyfxs5 1600w,
                https://res.cloudinary.com/dlcijbrpw/image/upload/f_auto,q_auto,w_2000/20_oyfxs5 2000w"
            imagesizes="100vw"
        />
        <!-- Have Adobe Fonts (Creative Cloud)? Paste your kit <link> here and
             Acumin Variable Concept will take over from Switzer automatically. -->
        <title>Anahom Stays — A quiet hospitality company in Goa</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>

        <!--
        Netlify Forms detector.
        Netlify discovers forms by scanning the HTML it receives at deploy
        time — it never runs React, so it would never see the real form.
        This hidden twin declares the form and its fields so submissions
        from the live React form are accepted and stored. Field names here
        MUST match the ones in src/components/site/Contact.jsx.
        -->
        <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
            <input type="text" name="name" />
            <input type="email" name="email" />
            <input type="text" name="phone" />
            <input type="text" name="intent" />
            <textarea name="message"></textarea>
        </form>

        <!--
        First paint. Until React mounts, #root would otherwise be empty
        and the visitor stares at blank white.

        This paints nothing but the brand's warm ground — deliberately.
        The preloader opens on silence, an empty cream field, before the
        arch begins to rise. Painting the mark here would show it, lose
        it the instant React mounts, then build it again. So the very
        first frame is simply the ground the whole film happens on, and
        the handover is invisible. React replaces this on mount.
        -->
        <div id="root">
            <div style="position: fixed; inset: 0; background: #f6f1e9"></div>
        </div>
    </body>
</html>
